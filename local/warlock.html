
<!DOCTYPE html>
<html>
<head>
<script src="notes-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Warlock</title>
<style>
body {
    background:#0e0e0e;
    color:white;
    font-family:Arial;
    padding:12px;
}
.activity {
    background:#1c1c1c;
    border-radius:10px;
    padding:14px;
    margin-bottom:12px;
}
h1 { color:#00aaff; }
hr { border:1px solid #333; }

.note-toggle {
  margin-top: 8px;
  background: #222;
  color: #00aaff;
  border: 1px solid #333;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
}

.note-toggle:hover {
  background: #00aaff;
  color: #000;
}

.note-box {
  display: none;
  margin-top: 8px;
}

.note-box textarea {
  width: 100%;
  min-height: 60px;
  max-height: 120px;
  resize: vertical;
  background: #111;
  color: #fff;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 8px;
  font-size: 0.95rem;
}

.note-box {
  display: none;
  margin-top: 8px;
}

.note-box textarea {
  width: 100%;
  min-height: 80px;
  background: #111;
  color: #fff;
  border-radius: 6px;
  padding: 8px;
  border: 1px solid #333;
  resize: vertical;
}

.note-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 6px;
}

.note-actions button {
  background: #00aaff;
  color: #000;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

.note-actions button:hover {
  background: #33bbff;
}

/* Mobile touch stability */
button, textarea {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* Prevent zoom jump on focus */
textarea {
  font-size: 16px;
}

/* Larger tap targets */
.note-toggle,
.note-actions button {
  min-height: 44px;
}

/* Better mobile layout */
@media (max-width: 720px) {
  body {
    padding: 8px;
  }

  .activity {
    padding: 12px;
  }

  h3 {
    font-size: 1.05rem;
  }

  .note-toggle {
    width: 100%;
    margin-top: 10px;
  }

  .note-actions button {
    width: 100%;
  }
}

.nav {
  margin: 12px 0 18px 0;
  text-align: center;
  font-size: 0.95rem;
}

.nav a {
  color: #00aaff;
  text-decoration: none;
  margin: 0 8px;
  font-weight: bold;
}

.nav a:hover {
  color: #33bbff;
}
</style>
<script>
function toggleNote(id, type) {
  const box = document.getElementById("note-box-" + type + "-" + id);
  if (!box) return;
  box.style.display = (box.style.display === "block") ? "none" : "block";
}

function saveNote(id, type) {
  const input = document.getElementById("note-input-" + type + "-" + id);
  if (!input) return;
  localStorage.setItem("note-" + type + "-" + id, input.value);
  alert("Saved");
}

function loadNote(id, type) {
  const saved = localStorage.getItem("note-" + type + "-" + id);
  if (saved !== null) {
    const input = document.getElementById("note-input-" + type + "-" + id);
    if (input) input.value = saved;
  }
}

document.addEventListener("DOMContentLoaded", function () {
    loadAllNotes();
    document.querySelectorAll(".note-toggle").forEach(btn => {
        btn.addEventListener("click", function () {
        toggleNote(this.dataset.id, this.dataset.type);
        });
    });

document.querySelectorAll(".note-actions button").forEach(btn => {
    btn.addEventListener("click", function () {
    const parent = this.closest(".note-box");
    const id = parent.id.split("-").pop();
    const type = parent.id.split("-")[2];
    saveNote(id, type);
    });
});
});
</script>


</head>
<body>
<h1>Warlock</h1>
<div class="nav">
    <a href="titan.html">Titan</a> | <a href="hunter.html">Hunter</a> | <a href="fireteam.html">Fireteam</a>
</div>


</body>
</html>
